name: tests
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-wxgtk4.0 python3-pytest xvfb git
      - run: xvfb-run -a python3 -m pytest -q tests
  core:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q tests      # the window test is skipped (no wxPython here)
  package:
    runs-on: ubuntu-24.04
    needs: [linux, core]
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: pcm-package
          path: dist/*.zip
