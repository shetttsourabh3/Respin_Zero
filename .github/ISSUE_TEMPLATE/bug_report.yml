name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. In the plugin, open **Overview** and press **Report a problem...**, then paste the text below. It has versions, the tools found and the log, and no design data. Please read it before you post.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Problem report
      description: Paste the text from **Report a problem...**
      render: text
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Page
      options: [Overview, Design rules, Nets & currents, Datasheets, Schematic review, ERC / DRC, Power & thermal, Production files, Fabrication, History, Install / toolbar, Other]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or a small project (optional)
